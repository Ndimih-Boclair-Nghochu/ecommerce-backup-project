services:
  - type: web
    name: ecommerce-backup-project
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-backup-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: ndimihboclair4@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: SHOP_NAME
        value: MyShop

databases:
  - name: ecommerce-backup-db
    plan: free
    databaseName: ecommerce_backup
    user: ecommerce_backup_user
