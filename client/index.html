<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Shop premium electronics and accessories in Cameroon. Fast delivery to Bamenda, Douala, Yaoundé and across Cameroon." />
    <meta name="keywords" content="online shop cameroon, electronics bamenda, ecommerce cameroon, buy online XAF" />
    <meta property="og:title" content="MyShop — Premium Electronics & Accessories" />
    <meta property="og:description" content="Shop the best electronics and accessories in Cameroon with fast delivery nationwide." />
    <meta property="og:type" content="website" />
    <link rel="canonical" href="https://yourdomain.cm" />
    <title>MyShop - E-commerce</title>
    <!-- Preconnect for faster image loading -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #f9fafb; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            registrations.forEach(function(registration) {
              registration.unregister();
            });
          }).catch(function() {});
        }

        if ('caches' in window) {
          window.caches.keys().then(function(keys) {
            keys.forEach(function(key) {
              window.caches.delete(key);
            });
          }).catch(function() {});
        }
      })();
    </script>
    <script>
      window.addEventListener('load', function() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            registrations.forEach(function(registration) {
              registration.unregister();
            });
          });
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
