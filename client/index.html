    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: #f8fafc; color: #0f172a; }
      :root {
        --scc-blue: #0057a8;
        --scc-blue-dark: #003d7a;
        --scc-blue-light: #e8f0fb;
        --scc-green: #16a34a;
        --scc-green-light: #dcfce7;
        --scc-amber: #d97706;
        --scc-amber-light: #fef3c7;
        --scc-slate: #475569;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            registrations.forEach(function(r) { r.unregister(); });
          }).catch(function() {});
        }
        if ('caches' in window) {
          window.caches.keys().then(function(keys) {
            keys.forEach(function(key) { window.caches.delete(key); });
          }).catch(function() {});
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
