<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Shop premium electronics and accessories in Cameroon. Fast delivery to Bamenda, Douala, Yaoundé and across Cameroon." />
    <meta name="keywords" content="online shop cameroon, electronics bamenda, ecommerce cameroon, buy online XAF" />
    <meta property="og:title" content="MyShop — Premium Electronics & Accessories" />
    <meta property="og:description" content="Shop the best electronics and accessories in Cameroon with fast delivery nationwide." />
    <meta property="og:type" content="website" />
    <link rel="canonical" href="https://yourdomain.cm" />
    <title>MyShop - E-commerce</title>
    <!-- Preconnect for faster image loading -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <style>
      /* Instant loading skeleton so the page never looks blank on slow networks */
      body { margin: 0; font-family: system-ui, sans-serif; background: #f9fafb; }
      #app-shell {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .shell-nav {
        height: 64px;
        background: #1e40af;
        display: flex;
        align-items: center;
        padding: 0 24px;
      }
      .shell-nav-logo {
        width: 120px;
        height: 28px;
        background: rgba(255,255,255,0.25);
        border-radius: 6px;
        animation: pulse 1.5s ease-in-out infinite;
      }
      .shell-body { padding: 24px; max-width: 1280px; margin: 0 auto; width: 100%; box-sizing: border-box; }
      .shell-hero {
        height: 260px;
        background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
        border-radius: 12px;
        margin-bottom: 32px;
        animation: pulse 1.5s ease-in-out infinite;
      }
      .shell-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
      .shell-card {
        height: 260px;
        background: #e5e7eb;
        border-radius: 10px;
        animation: pulse 1.5s ease-in-out infinite;
      }
      .shell-card:nth-child(2) { animation-delay: 0.1s; }
      .shell-card:nth-child(3) { animation-delay: 0.2s; }
      .shell-card:nth-child(4) { animation-delay: 0.3s; }
      .shell-card:nth-child(5) { animation-delay: 0.4s; }
      .shell-card:nth-child(6) { animation-delay: 0.5s; }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
    </style>
  </head>
  <body>
    <!-- App shell skeleton visible instantly while JS loads -->
    <div id="app-shell">
      <div class="shell-nav">
        <div class="shell-nav-logo"></div>
      </div>
      <div class="shell-body">
        <div class="shell-hero"></div>
        <div class="shell-grid">
          <div class="shell-card"></div>
          <div class="shell-card"></div>
          <div class="shell-card"></div>
          <div class="shell-card"></div>
          <div class="shell-card"></div>
          <div class="shell-card"></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      // Hide skeleton once React mounts
      document.addEventListener('DOMContentLoaded', function() {
        var observer = new MutationObserver(function() {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            var shell = document.getElementById('app-shell');
            if (shell) shell.style.display = 'none';
            observer.disconnect();
          }
        });
        observer.observe(document.getElementById('root'), { childList: true, subtree: false });
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
